<script>
"use strict";
/* ================= 工具 ================= */
function pad(n,l){n=String(n);while(n.length<(l||2))n="0"+n;return n}
function nowStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
function ageStr(ms){var s=Math.floor(ms/1000);if(s<60)return s+"s";var m=Math.floor(s/60);if(m<60)return m+"m";var h=Math.floor(m/60);if(h<24)return h+"h";var d=Math.floor(h/24);if(d<30)return d+"d";var mo=Math.floor(d/30);if(mo<12)return mo+"mo";return Math.floor(mo/12)+"y"}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
/* ================= 文件系统 ================= */
var FS_KEY="tty_fs_v1", K_KEY="tty_k8s_v1", D_KEY="tty_dock_v1";
function file(content,mode){return {t:"f",c:content||"",m:mode||"644"}}
function dir(children){return {t:"d",ch:children||{}}}
function defaultFS(){
  var E="echo hello\n";
  return dir({
    root:dir({}),
    home:dir({

    }),
    etc:dir({

      passwd:file("root:x:0:0:root:/root:/bin/bash\nstudent:x:1000:1000:student:/home/student:/bin/bash\n"),

      group:file("root:x:0:\nstudent:x:1000:\ndocker:x:999:\n"),
      "resolv.conf":file("nameserver 223.5.5.5\nnameserver 8.8.8.8\n"),

      docker:dir({"daemon.json":file("{\n  \"registry-mirrors\": [\"https://docker.mirrors.ustc.edu.cn\"]\n}\n")}),
      kubernetes:dir({"kubelet.conf":file("apiVersion: kubelet.config.k8s.io/v1beta1\nkind: KubeletConfiguration\n" + "clusterDNS:\n- 10.96.0.10\n")})
    }),
    usr:dir({
      local:dir({bin:dir({}),src:dir({})}),
      share:dir({nginx:dir({html:dir({"index.html":file("<h1>Welcome to nginx!</h1>\n<p>If you see this page, the nginx web server is successfully installed.\n</p>\n")})})})
    }),
    var:dir({
      log:dir({nginx:dir({"access.log":file("127.0.0.1 - - [10/Sep/2026:10:00:01 +0800] \"GET / HTTP/1.1\" 200 612\n127.0.0.1 - - [10/Sep/2026:10:00:05 +0800] \"GET /index.html HTTP/1.1\" 200 612\n")})}),
      lib:dir({docker:dir({})}),run:dir({})
    }),
    tmp:dir({}),opt:dir({}),mnt:dir({}),media:dir({}),srv:dir({}),dev:dir({}),proc:dir({}),sys:dir({}),data:dir({})
  });
}
function getNode(fs,path){
  var parts=path.split("/").filter(Boolean);var n=fs;
  for(var i=0;i<parts.length;i++){if(!n||n.t!=="d")return null;if(n.ch[parts[i]]===undefined)return null;n=n.ch[parts[i]]}
  return n;
}
function resolvePath(cwd,p){
  if(p==="~")return env.HOME||"/root";
  if(p.indexOf("~")===0&&p.length>1)return "/home/"+p.slice(1);
  if(p[0]!=="/")p=cwd+"/"+p;
  var parts=[],raw=p.split("/");
  for(var i=0;i<raw.length;i++){var s=raw[i];if(!s||s===".")continue;if(s===".."){if(parts.length)parts.pop()}else parts.push(s)}
  return "/"+parts.join("/");
}
function parentOf(p){var i=p.lastIndexOf("/");return i<=0?"/":p.slice(0,i)}
function baseOf(p){var i=p.lastIndexOf("/");return i<0?p:p.slice(i+1)}
function mkdirP(fs,cwd,p){var rp=resolvePath(cwd,p);var parts=rp.split("/").filter(Boolean);var n=fs;for(var i=0;i<parts.length;i++){if(!n.ch[parts[i]])n.ch[parts[i]]=dir({});n=n.ch[parts[i]]}return rp}
function readFile(fs,cwd,p){var n=getNode(fs,resolvePath(cwd,p));if(!n)return null;if(n.t==="d")return null;return n.c}
function writeFile(fs,cwd,p,content){var rp=resolvePath(cwd,p);var par=parentOf(rp);var pn=getNode(fs,par);if(!pn||pn.t!=="d")return false;pn.ch[baseOf(rp)]=file(content);return true}
function appendFile(fs,cwd,p,content){var rp=resolvePath(cwd,p);var old=readFile(fs,cwd,p);return writeFile(fs,cwd,p,(old||"")+content)}
function lsDir(fs,cwd,p){var n=getNode(fs,resolvePath(cwd,p));if(!n)return null;if(n.t!=="d")return null;return n.ch}
/* ================= 状态 ================= */
var FS=defaultFS(),cwd="/root",env={HOME:"/root",USER:"root",PATH:"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",SHELL:"/bin/bash",PS1:"\\w"},aliases={},history=[],histIdx=-1,uid=0,username="root",hostname="cloudlab";
function loadState(){try{var f=localStorage.getItem(FS_KEY);if(f){var o=JSON.parse(f);if(o&&o.t==="d")FS=o}}catch(e){}}
function saveFS(){try{localStorage.setItem(FS_KEY,JSON.stringify(FS))}catch(e){}}
function fmtMode(n){
  var m=n.m||"644";var bits=parseInt(m,8);var map="rwxrwxrwx",s="";
  for(var i=0;i<9;i++)s+=(bits&(1<<(8-i)))?"rwx"[i%3]:"-";
  return (n.t==="d"?"d":"-")+s;
}
function fmtLs(n,name,long){
  if(long){
    var size=(n.t==="d")?4096:(n.c?n.c.length:0);
    return fmtMode(n)+" 1 root root "+pad(size,6)+" Sep 10 10:00 "+name;
  }
  return name;
}
/* ================= 解析引擎 ================= */
function tokenize(s){
  var toks=[],cur="",q=null,has=false,squote=false;
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if(q){
      if(ch===q){q=null;if(ch==="'")squote=true}
      else if(ch==="\\"&&q==='"'){i++;if(i<s.length)cur+=s[i]}
      else cur+=ch;
      continue;
    }
    if(ch==="'"||ch==='"'){q=ch;has=true}
    else if(ch==="\\"){i++;if(i<s.length)cur+=s[i]}
    else if(ch===" "||ch==="\t"){if(has||cur){toks.push((squote?"\u0001":"")+cur);cur="";has=false;squote=false}}
    else cur+=ch;
  }
  if(has||cur)toks.push((squote?"\u0001":"")+cur);
  return toks;
}
function splitOuter(s,sep){
  var out=[],cur="",q=null,depth=0;
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if(q){if(ch===q)q=null;else if(ch==="\\"&&q==='"'){i++;if(i<s.length)cur+=s[i]}else cur+=ch;continue}
    if(ch==="'"||ch==='"'){q=ch;cur+=ch}
    else if(ch==="("){depth++;cur+=ch}
    else if(ch===")"){depth--;cur+=ch}
    else if(depth===0&&sep.indexOf(ch)>=0){out.push(cur);cur=""}
    else cur+=ch;
  }
  out.push(cur);
  return out;
}
function splitLogical(line){
  var segs=[],cur="",op=";",q=null;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(q){cur+=ch;if(ch===q)q=null;continue}
    if(ch==="'"||ch==='"'){q=ch;cur+=ch;continue}
    if(ch==="&"&&line[i+1]==="&"){segs.push({op:op,text:cur.trim()});cur="";op="&&";i++;continue}
    if(ch==="|"&&line[i+1]==="|"){segs.push({op:op,text:cur.trim()});cur="";op="||";i++;continue}
    if(ch===";"){segs.push({op:op,text:cur.trim()});cur="";op=";";continue}
    cur+=ch;
  }
  segs.push({op:op,text:cur.trim()});
  return segs.filter(function(x){return x.text!==""});
}
function splitPipe(text){
  var out=[],cur="",q=null;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){cur+=ch;if(ch===q)q=null;continue}
    if(ch==="'"||ch==='"'){q=ch;cur+=ch;continue}
    if(ch==="|"){out.push(cur);cur="";continue}
    cur+=ch;
  }
  out.push(cur);
  return out;
}
function parseStage(stage){
  var toks=tokenize(stage),args=[],redirs={};
  for(var i=0;i<toks.length;i++){
    var t=toks[i];
    if(t===">"){redirs.out=(toks[i+1]||"");i++}
    else if(t===">>"){redirs.append=(toks[i+1]||"");i++}
    else if(t==="2>"){redirs.err2=(toks[i+1]||"");i++}
    else if(t==="2>>"){redirs.err2a=(toks[i+1]||"");i++}
    else if(t==="<"){redirs.inp=(toks[i+1]||"");i++}
    else if(t.indexOf("2>>")===0){redirs.err2a=t.slice(3)}
    else if(t.indexOf("2>")===0){redirs.err2=t.slice(2)}
    else if(t.indexOf(">>")===0){redirs.append=t.slice(2)}
    else if(t.indexOf(">")===0){redirs.out=t.slice(1)}
    else if(t.indexOf("<")===0){redirs.inp=t.slice(1)}
    else args.push(t);
  }
  return {args:args,redirs:redirs};
}
function expandVar(s){
  var out="",i=0;
  while(i<s.length){
    var ch=s[i];
    if(ch==="$"&&i+1<s.length){
      var j=i+1,name="";
      if(s[j]==="{"){j++;while(j<s.length&&s[j]!=="}"){name+=s[j];j++}j++}
      else{while(j<s.length&&/[A-Za-z0-9_]/.test(s[j])){name+=s[j];j++}}
      if(name==="?")out+="0";
      else out+=(env[name]!==undefined?env[name]:"");
      i=j;continue;
    }
    out+=ch;i++;
  }
  return out;
}
function globExpand(arg){
  if(arg.indexOf("*")<0&&arg.indexOf("?")<0)return [arg];
  var abs=arg[0]==="/";
  var parts=arg.split("/").filter(Boolean);
  var start=abs?"":"";
  function expandIn(dirPath,remain){
    var out=[];
    if(!remain.length)return out;
    var head=remain[0],rest=remain.slice(1);
    var ch=lsDir(FS,cwd,dirPath===""?"/":dirPath)||{};
    var names=Object.keys(ch);
    if(head.indexOf("*")<0&&head.indexOf("?")<0){
      var full=dirPath+"/"+head;
      if(rest.length===0){if(getNode(FS,full))out.push(full)}
      else out=out.concat(expandIn(full,rest));
      return out;
    }
    var re=new RegExp("^"+head.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*").replace(/\?/g,".")+"$");
    names.forEach(function(n){
      if(re.test(n)){
        var full=dirPath+"/"+n;
        if(rest.length===0)out.push(full);
        else if((getNode(FS,full)||{}).t==="d")out=out.concat(expandIn(full,rest));
      }
    });
    return out;
  }
  var res=expandIn(start,parts);
  var out=[];
  for(var k=0;k<res.length;k++)out.push(res[k].replace(/^\/\//,"/"));
  return out.length?out:[arg];
}
function expandArgs(args){
  var out=[];
  for(var i=0;i<args.length;i++){
    var a=args[i];
    if(a[0]==="\u0001"){out.push(a.slice(1));continue}
    a=expandVar(a);
    if(a==="~")a=env.HOME||"/root";
    var g=globExpand(a);
    for(var j=0;j<g.length;j++)out.push(g[j]);
  }
  return out;
}
/* ================= 命令注册 ================= */
var CMDS={};
function reg(name,fn,desc){CMDS[name]={fn:fn,desc:desc||""}}
/* ================= 执行器 ================= */
var gExit=0,lastErrOut="";
async function execPipeline(text){
  var out=[],err=[],exit=0;
  var segs=splitLogical(text);
  for(var s=0;s<segs.length;s++){
    var seg=segs[s];
    if(seg.op==="&&"&&exit!==0)continue;
    if(seg.op==="||"&&exit===0)continue;
    var r=await execPipeSeg(seg.text);
    out=out.concat(r.out);err=err.concat(r.err);exit=r.exit;
    if(seg.op==="&&"&&exit!==0)break;
    if(seg.op==="||"&&exit===0)break;
  }
  return {out:out,err:err,exit:exit};
}
async function execPipeSeg(text){
  var stages=splitPipe(text);
  var stdin=heredocStdin||"",out=[],err=[],exit=0;
  heredocStdin="";
  for(var i=0;i<stages.length;i++){
    if(!stages[i].trim())continue;
    var ps=parseStage(stages[i]);
    if(!ps.args.length)continue;
    var argv=expandArgs(ps.args);
    var name=argv[0];
    if(ps.redirs.inp!==undefined){var f=readFile(FS,cwd,expandVar(ps.redirs.inp));stdin=(f===null?"":f)}
    var ctx={args:argv,name:name,stdin:stdin,out:[],err:[],fs:FS,cwd:cwd,env:env};
    var fn=CMDS[name];
    var code=127;
    if(fn){code=await fn.fn(ctx)}
    else{
      var al=aliases[name];
      if(al){var r=await execPipeline(expandVar(al)+" "+(argv.slice(1).map(quoteArg).join(" ")));out=r.out;err=r.err;exit=r.exit;stdin=out.join("\n");continue}
      if(/^[.\/]/.test(name)){
        var np=getNode(FS,resolvePath(cwd,name));
        if(np&&np.t==="f"&&(/^#!/.test(np.c))){code=await runScript(np.c,argv.slice(1))}
        else {ctx.err.push("bash: "+name+": 无法执行二进制文件或脚本");code=126}
      }else{
        ctx.err.push("bash: "+name+": command not found");
      }
    }
    out=ctx.out;err=ctx.err;
    if(ps.redirs.out!==undefined){writeFile(FS,cwd,expandVar(ps.redirs.out),ctx.out.join("\n")+(ctx.out.length?"\n":""));out=[];ctx.out=[]}
    if(ps.redirs.append!==undefined){appendFile(FS,cwd,expandVar(ps.redirs.append),ctx.out.join("\n")+(ctx.out.length?"\n":""));out=[];ctx.out=[]}
    if(ps.redirs.err2!==undefined){writeFile(FS,cwd,expandVar(ps.redirs.err2),ctx.err.join("\n")+(ctx.err.length?"\n":""));err=[];ctx.err=[]}
    if(ps.redirs.err2a!==undefined){appendFile(FS,cwd,expandVar(ps.redirs.err2a),ctx.err.join("\n")+(ctx.err.length?"\n":""));err=[];ctx.err=[]}
    exit=code;gExit=code;lastErrOut=ctx.err.join("\n");
    stdin=ctx.out.join("\n");
  }
  return {out:out,err:err,exit:exit};
}
function quoteArg(s){return /[\s"'$|&;<>*?]/.test(s)?"'"+s.replace(/'/g,"'\\''")+"'":s}
async function runScript(src,args){
  var lines=src.split("\n").filter(function(l){return l.trim()&&l[0]!=="#"});
  var r0={out:[],err:[],exit:0};
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    for(var j=0;j<args.length;j++)line=line.split("$"+(j+1)).join(args[j]);
    var r=await execPipeline(line);
    r0.out=r0.out.concat(r.out);r0.err=r0.err.concat(r.err);r0.exit=r.exit;
  }
  return r0.exit;
}
function printOut(lines){lines.forEach(function(l){addLine(l,"")})}
function printErr(lines){lines.forEach(function(l){addLine(l,"r")})}
/* ================= UI ================= */

/* ================= 基础命令 ================= */
reg("help",async function(ctx){

    ctx.out.push("","练习提示：先 cat > /tmp/app.yaml <<EOF 写一个 Deployment，再 kubectl apply -f /tmp/app.yaml，然后 get/describe/scale/rollout 观察变化。");
    return 0}
  if(a==="docker"){
    ["docker ps -a","docker images","docker run -d --name web -p 8080:80 nginx","docker exec -it web bash","docker logs web","docker stop web","docker rm web","docker rmi nginx","docker network ls","docker volume ls","docker build -t myapp .","docker stats"].forEach(function(x){ctx.out.push("  "+x)});
    ctx.out.push("","练习提示：镜像池内置 nginx / redis / mysql / alpine / ubuntu，可以直接 run。");

reg("tree",async function(ctx){
  var rp=resolvePath(cwd,ctx.args[1]||".");var n=getNode(FS,rp);
  if(!n){ctx.err.push("tree: No such file or directory");return 1}
  var out=[rp];
  function walk(node,path,prefix){
    var ks=Object.keys(node.ch||{}).sort();
    for(var i=0;i<ks.length;i++){
      var last=i===ks.length-1;
      out.push(prefix+(last?"└── ":"├── ")+ks[i]);
      if(node.ch[ks[i]].t==="d")walk(node.ch[ks[i]],path+"/"+ks[i],prefix+(last?"    ":"│   "));
    }
  }
  walk(n,rp,"");
  out.push("");
  ctx.out.push(out.join("\n"));
  return 0;
});

    else if(/^[ctxzfjv]+$/.test(t)&&t.indexOf("f")>=0){parseOpts(t)}

function syncPodsForDeploy(dep){
  var pods=getNsArr(K.pods,dep.ns);
  var mine=pods.filter(function(p){return p.owner===dep.name});
  while(mine.length<dep.replicas){
    var p=mkPod(dep.name,Date.now());p.ns=dep.ns;p.image=dep.image;
    pods.push(p);mine.push(p);

function yamlOf(obj,indent){
  var ind=" ".repeat(indent||0);var out=[];
  Object.keys(obj).forEach(function(k){
    var v=obj[k];
    if(v===null||v===undefined)out.push(ind+k+": null");
    else if(typeof v==="object"){
      if(Array.isArray(v)){out.push(ind+k+":");v.forEach(function(it){if(typeof it==="object"){out.push(ind+"  -");Object.keys(it).forEach(function(ik){out.push(ind+"    "+ik+": "+(typeof it[ik]==="object"?JSON.stringify(it[ik]):it[ik]))})}else out.push(ind+"  - "+it)})}
      else if(Object.keys(v).length){out.push(ind+k+":");out.push(yamlOf(v,indent+2))}
      else out.push(ind+k+": {}");
    }
    else out.push(ind+k+": "+v);
  });
  return out.join("\n");
}

    ctx.out.push("KIND:     "+t+"\nVERSION:  v1\n\nFIELDS:\n   apiVersion   <string>\n   kind <string>\n   metadata     <Object>\n   spec <Object>");
    return 0}
  if(sub==="top"){
    var t=rest[0];
    if(t==="node"){ctx.out.push("NAME      CPU(cores)   CPU%   MEMORY(bytes)   MEMORY%");K.nodes.forEach(function(n){var c=Math.floor(Math.random()*1500+300),m=Math.floor(Math.random()*3e6+2e6);ctx.out.push(padStr(n.name,9)+"  "+c+"m         "+(c/8000*100).toFixed(2)+"%   "+m+"Mi         "+(m/8192).toFixed(1)+"%")});return 0}
    if(t==="pod"||!t){ctx.out.push("NAME                                        CPU(cores)   MEMORY(bytes)");getNsArr(K.pods,ns).forEach(function(p){ctx.out.push(padStr(p.name,42)+"  "+(Math.floor(Math.random()*80+5))+"m          "+(Math.floor(Math.random()*200+30))+"Mi")});return 0}
    ctx.err.push("kubectl top: 支持 node / pod");
    return 1}
  if(sub==="get"&&!res){}
  if(sub==="label"){
    var t=rest[0],nm=rest[1],kv=rest[2];
    if(!nm){ctx.err.push("label 需要对象");return 1}
    ctx.out.push((t||"pod")+"/"+nm+" labeled");

  if(sub==="annotate"){ctx.out.push(rest[1]+" annotated");return 0}
  if(sub==="edit"){ctx.out.push("（kubectl edit 为交互式编辑器，模拟器不支持；可练习 apply -f 声明式管理）");return 1}

  ctx.err.push("kubectl: '"+sub+"' 未在模拟器实现，可用: get / describe / apply / delete / logs / exec / scale / rollout / port-forward / version / cluster-info / api-resources / config / explain / top / label / cordon");
  return 1;
},"Kubernetes 集群管理");
/* ================= YAML 解析 ================= */
function parseYaml(text){
  var lines=text.split("\n");
  var root={};
  var indentStack=[-1],nodeStack=[root],keyStack=[null],listStack=[null];
  function scalar(v){
    v=v.trim();
    if((v[0]==="\""&&v.slice(-1)==="\"")||(v[0]==="'"&&v.slice(-1)==="'"))return v.slice(1,-1);
    if(v==="true")return true;
    if(v==="false")return false;
    if(v==="null"||v==="~")return null;
    if(/^-?\d+$/.test(v))return parseInt(v);
    if(/^-?\d+\.\d+$/.test(v))return parseFloat(v);
    return v;
  }
  for(var i=0;i<lines.length;i++){
    var raw=lines[i];
    if(!raw.trim()||raw.trim()[0]==="#")continue;
    var t=raw.replace(/^\s+/,"");
    var ind=raw.length-t.length;
    while(indentStack.length>1&&ind<=indentStack[indentStack.length-1]){
      indentStack.pop();nodeStack.pop();keyStack.pop();listStack.pop();
    }
    var node=nodeStack[nodeStack.length-1];
    var list=listStack[listStack.length-1];
    if(t[0]==="-"){
      var it=t.slice(1).trim();
      if(!list){
        list=[];
        node[keyStack[keyStack.length-1]]=list;
        listStack[listStack.length-1]=list;
      }
      var m=it.match(/^([\w.\/-]+):\s*(.*)$/);
      if(m){
        var item={};
        list.push(item);
        var k2=m[1],v2=m[2].trim();
        if(v2===""){indentStack.push(ind+1);nodeStack.push(item);keyStack.push(k2);listStack.push(null)}
        else item[k2]=scalar(v2);
      }else if(it){list.push(scalar(it))}
      continue;
    }
    var mm=t.match(/^([\w.\/-]+):\s*(.*)$/);
    if(mm){
      var k3=mm[1],v3=mm[2].trim();
      if(v3===""){
        var child={};
        node[k3]=child;
        indentStack.push(ind);nodeStack.push(child);keyStack.push(k3);listStack.push(null);
      }else{
        node[k3]=scalar(v3);
      }
    }
  }
  return root;
}

/* ================= 输入处理 ================= */
var busy=false,heredocActive=false,heredocEnd=null,heredocCmd=null,heredocBody=[],heredocStdin="";
cmdEl.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.keyCode===13)&&!e.isComposing){
    e.preventDefault();
    if(busy)return;
    var line=cmdEl.value;
    if(heredocActive){
      var tl=line.trim();
      if(tl===heredocEnd){
        heredocActive=false;
        addLine("> "+line,"");
        renderPrompt();
        cmdEl.value="";
        heredocStdin=heredocBody.join("\n");
        heredocBody=[];
        resetHint();
        runLine(heredocCmd);
      }else if(tl==="exit"||tl==="quit"){
        heredocActive=false;heredocBody=[];heredocEnd=null;heredocCmd=null;heredocStdin="";
        addLine("> "+line,"");
        addLine("（已退出多行输入模式）","d");
        renderPrompt();
        cmdEl.value="";
        resetHint();
      }else{
        heredocBody.push(line);
        addLine("> "+line,"");
        cmdEl.value="";
      }
      return;
    }
    if(!line.trim()){addLine(promptStr(),"");cmdEl.value="";return}
    var hdm=line.match(/<<\s*['"]?(\w+)['"]?/);
    if(hdm){
      history.push(line);
      if(history.length>500)history.shift();
      histIdx=history.length;
      addLine(promptStr()+line,"");
      cmdEl.value="";
      heredocActive=true;heredocEnd=hdm[1];heredocCmd=line.replace(/<<\s*['"]?(\w+)['"]?/,"").replace(/\s+$/,"");heredocBody=[];
      promptEl.textContent="> ";
      var hintEl=document.getElementById("hint");if(hintEl)hintEl.textContent="输入结束符(如 EOF)或 exit 退出";
      return;
    }
    history.push(line);
    if(history.length>500)history.shift();
    histIdx=history.length;
    addLine(promptStr()+line,"");
    cmdEl.value="";
    runLine(line);
  }else if(e.key==="ArrowUp"){
    e.preventDefault();
    if(histIdx>0){histIdx--;cmdEl.value=history[histIdx]}
  }else if(e.key==="ArrowDown"){
    e.preventDefault();
    if(histIdx<history.length){histIdx++;cmdEl.value=histIdx<history.length?history[histIdx]:""}
  }else if(e.key==="Tab"){
    e.preventDefault();
    doTab();
  }else if(e.key==="c"&&e.ctrlKey){
    e.preventDefault();
    cmdEl.value="";
    if(heredocActive){heredocActive=false;heredocBody=[];renderPrompt();resetHint();addLine("^C","d");return}
    addLine("^C","d");
    renderPrompt();
  }
});
function resetHint(){var h=document.getElementById("hint");if(h)h.textContent="Tab补全 ↑↓历史 Enter执行"}
async function runLine(line){
  busy=true;
  var r=await execPipeline(line);
  printOut(r.out);printErr(r.err);
  saveFS();
  busy=false;
  renderPrompt();
}
function doTab(){
  var v=cmdEl.value;
  var m=v.match(/(^|\s)([^\s]*)$/);
  if(!m)return;
  var prefix=m[2];
  var candidates=[];
  if(!/[\s\/]/.test(v.slice(0,m[1].length+1))){candidates=Object.keys(CMDS).filter(function(c){return c.indexOf(prefix)===0})}
  if(!candidates.length){
    var cwd2=cwd;
    var head="";
    if(prefix.indexOf("/")>=0){head=prefix.slice(0,prefix.lastIndexOf("/")+1);var tail=prefix.slice(prefix.lastIndexOf("/")+1);cwd2=resolvePath(cwd,head)}
    var ch=lsDir(FS,cwd,cwd2)||{};
    candidates=Object.keys(ch).filter(function(n){return n.indexOf(prefix.slice(prefix.lastIndexOf("/")+1))===0}).map(function(n){return (prefix.indexOf("/")>=0?head:"")+n});
  }
  if(candidates.length===1){
    var rest=v.slice(0,v.length-prefix.length)+candidates[0];
    cmdEl.value=rest+(CMDS[candidates[0]]?" ":" ");
  }else if(candidates.length>1){
    addLine(promptStr()+v,"");
    candidates.forEach(function(c){addLine(c,"d")});
  }
}
